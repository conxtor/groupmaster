name: Publish public WAGI linux/amd64 images to GHCR

on:
  workflow_dispatch:
    inputs:
      image_owner:
        description: "GitHub/GHCR owner"
        required: false
        default: conxtor
        type: string
      tag:
        description: "Image tag used by the Dockge deployment"
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: wagi-api
            context: .
            dockerfile: apps/api/Dockerfile
          - image: wagi-web
            context: .
            dockerfile: apps/web/Dockerfile
          - image: wagi-ai-worker
            context: .
            dockerfile: apps/ai-worker/Dockerfile
          - image: wagi-media-worker
            context: .
            dockerfile: apps/media-worker/Dockerfile
          - image: wagi-wa-connector
            context: .
            dockerfile: apps/wa-connector/Dockerfile
          - image: wagi-tg-connector
            context: .
            dockerfile: apps/tg-connector/Dockerfile
          - image: wagi-nats-provisioner
            context: ./infra/nats-provisioner
            dockerfile: Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image owner
        id: image
        env:
          INPUT_IMAGE_OWNER: ${{ inputs.image_owner }}
        run: |
          owner="${INPUT_IMAGE_OWNER:-conxtor}"
          owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          # Production servers use Intel/AMD x86_64. Publish only this target
          # so every GHCR image has a deterministic production architecture.
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/${{ matrix.image }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/conxtor/groupmaster
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - name: Verify GHCR package is publicly pullable
        env:
          IMAGE_OWNER: ${{ steps.image.outputs.owner }}
          PACKAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          image_url="https://ghcr.io/v2/${IMAGE_OWNER}/${PACKAGE_NAME}/manifests/${IMAGE_TAG}"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "$image_url")"
          if [ "$status" != "200" ]; then
            echo "GHCR package ${IMAGE_OWNER}/${PACKAGE_NAME}:${IMAGE_TAG} is not publicly pullable (HTTP ${status})." >&2
            echo "Set the package visibility to Public in GitHub before rerunning this workflow." >&2
            exit 1
          fi
          echo "GHCR package ${IMAGE_OWNER}/${PACKAGE_NAME}:${IMAGE_TAG} is public."
