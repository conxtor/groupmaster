name: wagi-dockge

services:
  postgres:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data_dockge:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  migrate:
    image: ghcr.io/${GHCR_IMAGE_OWNER:-conxtor}/wagi-migrate:${GHCR_IMAGE_TAG:-latest}
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      WAGI_DB_PASSWORD: ${WAGI_DB_PASSWORD:?WAGI_DB_PASSWORD must be set}
    command:
      - /bin/sh
      - -ec
      - |
        /usr/local/bin/wagi-migrate
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        psql -h "$${DB_HOST}" -U "$${DB_USER}" -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 -v wagi_db_password="$${WAGI_DB_PASSWORD}" <<'SQL'
        ALTER ROLE wagi_app WITH PASSWORD :'wagi_db_password';
        SQL
    depends_on:
      postgres: {condition: service_healthy}
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    volumes:
      - nats_data_dockge:/data/jetstream
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
  nats-provisioner:
    image: ghcr.io/${GHCR_IMAGE_OWNER:-conxtor}/wagi-nats-provisioner:${GHCR_IMAGE_TAG:-latest}
    restart: "no"
    env_file:
      - ./env-dockge/nats-provisioner.env
    depends_on:
      nats: {condition: service_healthy}
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./env-dockge/minio.env
    volumes:
      - minio_data_dockge:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    image: ghcr.io/${GHCR_IMAGE_OWNER:-conxtor}/wagi-api:${GHCR_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./env-dockge/api.env
    volumes:
      - media_data_dockge:/data/media:ro
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      minio: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}
    labels:
      - traefik.enable=false

  # WhatsApp uses the PostgreSQL-backed whatsmeow connector for onboarding and
  # processing. The onboarding service exposes the internal QR/status endpoint;
  # the worker service consumes processing leases.
  wa-connector:
    image: ghcr.io/${GHCR_IMAGE_OWNER:-conxtor}/wagi-wa-connector-whatsmeow:${GHCR_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./env-dockge/wa-connector.env
    volumes:
      - media_data_dockge:/data/media
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}

  wa-connector-worker:
    image: ghcr.io/${GHCR_IMAGE_OWNER:-conxtor}/wagi-wa-connector-whatsmeow:${GHCR_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./env-dockge/wa-connector-worker.env
    volumes:
      - media_data_dockge:/data/media
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}
  tg-connector:
    image: ghcr.io/${GHCR_IMAGE_OWNER:-conxtor}/wagi-tg-connector:${GHCR_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./env-dockge/tg-connector.env
    volumes:
      - tg_state_dockge:/data/tg-state
      - media_data_dockge:/data/media
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}
  tg-connector-worker:
    image: ghcr.io/${GHCR_IMAGE_OWNER:-conxtor}/wagi-tg-connector:${GHCR_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./env-dockge/tg-connector-worker.env
    volumes:
      - tg_state_dockge:/data/tg-state
      - media_data_dockge:/data/media
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}
  ai-worker:
    image: ghcr.io/${GHCR_IMAGE_OWNER:-conxtor}/wagi-ai-worker:${GHCR_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./env-dockge/ai-worker.env
    volumes:
      - ai_models_dockge:/root/.cache/fastembed
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}
  media-worker:
    image: ghcr.io/${GHCR_IMAGE_OWNER:-conxtor}/wagi-media-worker:${GHCR_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./env-dockge/media-worker.env
    volumes:
      - whisper_models_dockge:/models
      - media_data_dockge:/data/media
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      minio: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}
  web:
    image: ghcr.io/${GHCR_IMAGE_OWNER:-conxtor}/wagi-web:${GHCR_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./env-dockge/web.env
    depends_on:
      api: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.services.wagi-web.loadbalancer.server.port=3000
      - traefik.http.routers.wagi-web.rule=Host(`${TRAEFIK_HOST:-conxtor.com}`)
      - traefik.http.routers.wagi-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.wagi-web.tls=true
      - traefik.http.routers.wagi-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.wagi-web.tls.domains[0].main=${TRAEFIK_HOST:-conxtor.com}
      - traefik.http.routers.wagi-web.service=wagi-web
      - traefik.http.routers.wagi-web.priority=10

volumes:
  postgres_data_dockge:
    name: wagi_dockge_postgres_data
  nats_data_dockge:
    name: wagi_dockge_nats_data
  minio_data_dockge:
    name: wagi_dockge_minio_data
  tg_state_dockge:
    name: wagi_dockge_tg_state
  whisper_models_dockge:
    name: wagi_dockge_whisper_models
  media_data_dockge:
    name: wagi_dockge_media_data
  ai_models_dockge:
    name: wagi_dockge_ai_models
