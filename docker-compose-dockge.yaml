name: wagi-dockge

services:
  postgres:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data_dockge:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  migrate:
    image: postgres:15-alpine
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      WAGI_DB_PASSWORD: ${WAGI_DB_PASSWORD:?WAGI_DB_PASSWORD must be set}
    volumes:
      - ./infra/migrations:/migrations:ro
      - ./infra/migration-runner:/runner:ro
    command:
      - /bin/sh
      - -ec
      - |
        /runner/run.sh
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        psql -h "$${DB_HOST}" -U "$${DB_USER}" -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 -v wagi_db_password="$${WAGI_DB_PASSWORD}" -c "ALTER ROLE wagi_app WITH PASSWORD :'wagi_db_password'"
    depends_on:
      postgres: {condition: service_healthy}
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    volumes:
      - nats_data_dockge:/data/jetstream
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
  nats-provisioner:
    image: ghcr.io/${GHCR_IMAGE_OWNER:-ea7klk}/wagi-nats-provisioner:${GHCR_IMAGE_TAG:-latest}
    restart: "no"
    environment:
      NATS_URL: nats://nats:4222
      NATS_EVENT_MAX_AGE_DAYS: ${NATS_EVENT_MAX_AGE_DAYS:-30}
      NATS_DLQ_MAX_AGE_DAYS: ${NATS_DLQ_MAX_AGE_DAYS:-90}
      NATS_MAX_DELIVERIES: ${NATS_MAX_DELIVERIES:-5}
    depends_on:
      nats: {condition: service_healthy}
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio_data_dockge:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    image: ghcr.io/${GHCR_IMAGE_OWNER:-ea7klk}/wagi-api:${GHCR_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://wagi_app:${WAGI_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable
      NATS_URL: nats://nats:4222
      PORT: 8080
      MEDIA_DIR: /data/media
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:?MEDIA_SIGNING_SECRET must be set}
      MEDIA_CLEANUP_TOKEN: ${MEDIA_CLEANUP_TOKEN:?MEDIA_CLEANUP_TOKEN must be set}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-wa-media}
      WAGI_CORS_ORIGIN: ${WAGI_CORS_ORIGIN:-}
      WAGI_COOKIE_SECURE: ${WAGI_COOKIE_SECURE:-true}
      WAGI_BOOTSTRAP_ADMIN_EMAIL: ${WAGI_BOOTSTRAP_ADMIN_EMAIL:-volker@kerkhoff.es}
      WAGI_BOOTSTRAP_ADMIN_NAME: ${WAGI_BOOTSTRAP_ADMIN_NAME:-Volker Kerkhoff}
      WAGI_BOOTSTRAP_ADMIN_PASSWORD: ${WAGI_BOOTSTRAP_ADMIN_PASSWORD:?WAGI_BOOTSTRAP_ADMIN_PASSWORD must be set}
      WA_CONNECTOR_POOL_SIZE: ${WA_CONNECTOR_POOL_SIZE:-5}
      TG_CONNECTOR_POOL_SIZE: ${TG_CONNECTOR_POOL_SIZE:-5}
      WA_ONBOARDING_SLOTS: ${WA_ONBOARDING_SLOTS:-1}
      TG_ONBOARDING_SLOTS: ${TG_ONBOARDING_SLOTS:-1}
    volumes:
      - media_data_dockge:/data/media:ro
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}
    labels:
      - traefik.enable=true
      - traefik.http.services.wagi-api.loadbalancer.server.port=8080
      - traefik.http.routers.wagi-api.rule=Host(`${TRAEFIK_HOST:-conxtor.com}`) && PathPrefix(`/api/`)
      - traefik.http.routers.wagi-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.wagi-api.tls=true
      - traefik.http.routers.wagi-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.wagi-api.service=wagi-api
      - traefik.http.routers.wagi-api.priority=100

  wa-connector:
    image: ghcr.io/${GHCR_IMAGE_OWNER:-ea7klk}/wagi-wa-connector:${GHCR_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://wagi_app:${WAGI_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      NATS_URL: nats://nats:4222
      PORT: 3001
      WA_MOCK_MODE: "false"
      WA_GROUP_ALLOWLIST: ${WA_GROUP_ALLOWLIST:-}
      WA_AUTH_DIR: /data/wa-auth
      WA_SYNC_HISTORY: ${WA_SYNC_HISTORY:-false}
      WA_BACKFILL_DAYS: ${WA_BACKFILL_DAYS:-7}
      WA_BACKFILL_THROTTLE_MS: ${WA_BACKFILL_THROTTLE_MS:-250}
      WA_BACKFILL_GROUP_DELAY_MS: ${WA_BACKFILL_GROUP_DELAY_MS:-1500}
      WA_HISTORY_PAGE_SIZE: ${WA_HISTORY_PAGE_SIZE:-50}
      WA_HISTORY_MAX_PAGES: ${WA_HISTORY_MAX_PAGES:-20}
      WA_HISTORY_WAIT_MS: ${WA_HISTORY_WAIT_MS:-20000}
      WA_MEDIA_DOWNLOAD_TIMEOUT_MS: ${WA_MEDIA_DOWNLOAD_TIMEOUT_MS:-30000}
      WA_MEDIA_DOWNLOAD_ATTEMPTS: ${WA_MEDIA_DOWNLOAD_ATTEMPTS:-3}
      WA_MEDIA_RETRY_INTERVAL_MS: ${WA_MEDIA_RETRY_INTERVAL_MS:-60000}
      GROUP_REFRESH_INTERVAL_MS: ${GROUP_REFRESH_INTERVAL_MS:-60000}
      MEDIA_DIR: /data/media
      MEDIA_CLEANUP_TOKEN: ${MEDIA_CLEANUP_TOKEN}
      CONNECTOR_POOL_ENABLED: ${CONNECTOR_POOL_ENABLED:-true}
      CONNECTOR_ROLE: onboarding
      WA_CONNECTOR_POOL_SIZE: ${WA_CONNECTOR_POOL_SIZE:-5}
      WA_ONBOARDING_SLOTS: ${WA_ONBOARDING_SLOTS:-1}
      CONNECTOR_SYNC_INTERVAL_SECONDS: ${CONNECTOR_SYNC_INTERVAL_SECONDS:-300}
      CONNECTOR_WORKER_ID: ${CONNECTOR_WORKER_ID:-}
      CONNECTOR_ACCOUNT_ID: ${WA_CONNECTOR_ACCOUNT_ID:-}
      CONNECTOR_LEASE_SECONDS: ${CONNECTOR_LEASE_SECONDS:-90}
      CONNECTOR_ACCOUNT_SLOT_SECONDS: ${CONNECTOR_ACCOUNT_SLOT_SECONDS:-1800}
      WAGI_BOOTSTRAP_ADMIN_EMAIL: ${WAGI_BOOTSTRAP_ADMIN_EMAIL:-volker@kerkhoff.es}
    volumes:
      - wa_auth_dockge:/data/wa-auth
      - media_data_dockge:/data/media
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}
  wa-connector-worker:
    image: ghcr.io/${GHCR_IMAGE_OWNER:-ea7klk}/wagi-wa-connector:${GHCR_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://wagi_app:${WAGI_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      NATS_URL: nats://nats:4222
      PORT: 3001
      WA_AUTH_DIR: /data/wa-auth
      WA_MOCK_MODE: "false"
      WA_SYNC_HISTORY: ${WA_SYNC_HISTORY:-false}
      WA_BACKFILL_DAYS: ${WA_BACKFILL_DAYS:-7}
      WA_BACKFILL_THROTTLE_MS: ${WA_BACKFILL_THROTTLE_MS:-250}
      WA_BACKFILL_GROUP_DELAY_MS: ${WA_BACKFILL_GROUP_DELAY_MS:-1500}
      WA_HISTORY_PAGE_SIZE: ${WA_HISTORY_PAGE_SIZE:-50}
      WA_HISTORY_MAX_PAGES: ${WA_HISTORY_MAX_PAGES:-20}
      WA_HISTORY_WAIT_MS: ${WA_HISTORY_WAIT_MS:-20000}
      WA_GROUP_ALLOWLIST: ${WA_GROUP_ALLOWLIST:-}
      WA_MEDIA_DOWNLOAD_TIMEOUT_MS: ${WA_MEDIA_DOWNLOAD_TIMEOUT_MS:-30000}
      WA_MEDIA_DOWNLOAD_ATTEMPTS: ${WA_MEDIA_DOWNLOAD_ATTEMPTS:-3}
      WA_MEDIA_RETRY_INTERVAL_MS: ${WA_MEDIA_RETRY_INTERVAL_MS:-60000}
      GROUP_REFRESH_INTERVAL_MS: ${GROUP_REFRESH_INTERVAL_MS:-60000}
      MEDIA_DIR: /data/media
      MEDIA_CLEANUP_TOKEN: ${MEDIA_CLEANUP_TOKEN}
      CONNECTOR_POOL_ENABLED: ${CONNECTOR_POOL_ENABLED:-true}
      CONNECTOR_ROLE: processing
      WA_CONNECTOR_POOL_SIZE: ${WA_CONNECTOR_POOL_SIZE:-5}
      WA_ONBOARDING_SLOTS: ${WA_ONBOARDING_SLOTS:-1}
      CONNECTOR_SYNC_INTERVAL_SECONDS: ${CONNECTOR_SYNC_INTERVAL_SECONDS:-300}
      CONNECTOR_WORKER_ID: ${CONNECTOR_WORKER_ID:-}
      CONNECTOR_ACCOUNT_ID: ${WA_CONNECTOR_ACCOUNT_ID:-}
      CONNECTOR_LEASE_SECONDS: ${CONNECTOR_LEASE_SECONDS:-90}
      CONNECTOR_ACCOUNT_SLOT_SECONDS: ${CONNECTOR_ACCOUNT_SLOT_SECONDS:-1800}
      CONNECTOR_START_DELAY_MS: ${CONNECTOR_START_DELAY_MS:-5000}
      CONNECTOR_POOL_RETRY_DELAY_MS: ${CONNECTOR_POOL_RETRY_DELAY_MS:-20000}
      WAGI_BOOTSTRAP_ADMIN_EMAIL: ${WAGI_BOOTSTRAP_ADMIN_EMAIL:-volker@kerkhoff.es}
    volumes:
      - wa_auth_dockge:/data/wa-auth
      - media_data_dockge:/data/media
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}
