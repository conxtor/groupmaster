      TG_MEDIA_RETRY_ATTEMPTS: ${TG_MEDIA_RETRY_ATTEMPTS:-4}
      GROUP_REFRESH_INTERVAL_MS: ${GROUP_REFRESH_INTERVAL_MS:-60000}
      MEDIA_DIR: /data/media
