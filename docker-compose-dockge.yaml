      WHISPER_MODEL_PATH: /models/ggml-medium.bin
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-auto}
      WHISPER_LANGUAGES: ${WHISPER_LANGUAGES:-es,ca,de,en,fr}
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
      MEDIA_MAX_RETRIES: ${MEDIA_MAX_RETRIES:-3}
      MEDIA_STALE_PROCESSING_SECONDS: ${MEDIA_STALE_PROCESSING_SECONDS:-900}
      MEDIA_DIR: /data/media
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-wa-media}
      MEDIA_CLEANUP_TOKEN: ${MEDIA_CLEANUP_TOKEN}
    volumes:
      - whisper_models_dockge:/models
      - media_data_dockge:/data/media
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      minio: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}
  web:
    image: ghcr.io/${GHCR_IMAGE_OWNER:-ea7klk}/wagi-web:${GHCR_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
      HOSTNAME: 0.0.0.0
    depends_on:
      api: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.services.wagi-web.loadbalancer.server.port=3000
      - traefik.http.routers.wagi-web.rule=Host(`${TRAEFIK_HOST:-conxtor.com}`)
      - traefik.http.routers.wagi-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.wagi-web.tls=true
      - traefik.http.routers.wagi-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.wagi-web.service=wagi-web
      - traefik.http.routers.wagi-web.priority=10

volumes:
  postgres_data_dockge:
    name: wagi_dockge_postgres_data
  nats_data_dockge:
    name: wagi_dockge_nats_data
  minio_data_dockge:
    name: wagi_dockge_minio_data
  wa_auth_dockge:
    name: wagi_dockge_wa_auth
  tg_state_dockge:
    name: wagi_dockge_tg_state
  whisper_models_dockge:
    name: wagi_dockge_whisper_models
  media_data_dockge:
    name: wagi_dockge_media_data
  ai_models_dockge:
    name: wagi_dockge_ai_models
