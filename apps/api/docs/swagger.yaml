info:
  contact:
    name: CONXTOR project
    url: https://github.com/conxtor/groupmaster
  description: |-
    REST API for ingesting, analyzing, and presenting selected WhatsApp and Telegram group conversations.
    The public deployment serves this API below the /api reverse-proxy prefix.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/conxtor/groupmaster
  title: CONXTOR Messaging Group Intelligence API
  version: 0.1.0
paths:
  /admin/ai-learning:
    get:
      parameters:
      - description: Language code
        in: query
        name: language
        type: string
      - description: Learning category
        in: query
        name: category
        type: string
      - description: Group UUID
        in: query
        name: groupId
        type: string
      - description: Search term, topic, group, or source
        in: query
        name: search
        type: string
      - description: Sort field, currently weight
        in: query
        name: sort
        type: string
      - description: asc or desc
        in: query
        name: sortDirection
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.aiLearningPageView'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: List AI learning terms
      tags:
      - ai-learning
    post:
      consumes:
      - application/json
      parameters:
      - description: Learning term
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.aiLearningTermRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Create AI learning term
      tags:
      - ai-learning
  /admin/ai-learning/{id}:
    delete:
      parameters:
      - description: Learning term UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Delete AI learning term
      tags:
      - ai-learning
    patch:
      consumes:
      - application/json
      parameters:
      - description: Learning term UUID
        in: path
        name: id
        required: true
        type: string
      - description: Learning term
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.aiLearningTermRequest'
      produces:
      - application/json
      responses:
        "200":
