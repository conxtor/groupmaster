services:
  db:
    image: supabase/postgres:15.8.1.060
    environment:
      # Supabase's bootstrap scripts require the standard postgres role.
      # Application services connect through the least-privileged app role created by the migration.
      POSTGRES_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supabase_admin} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: postgres:15-alpine
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - ../migrations:/migrations:ro
      - ../migration-runner:/runner:ro
    command: ["/bin/sh", "/runner/run.sh"]
    depends_on:
      db: {condition: service_healthy}

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    volumes:
      - nats_data:/data/jetstream
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats-provisioner:
    build:
      context: ../nats-provisioner
      dockerfile: Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      NATS_EVENT_MAX_AGE_DAYS: ${NATS_EVENT_MAX_AGE_DAYS:-30}
      NATS_DLQ_MAX_AGE_DAYS: ${NATS_DLQ_MAX_AGE_DAYS:-90}
      NATS_REASSESSMENT_MAX_AGE_DAYS: ${NATS_REASSESSMENT_MAX_AGE_DAYS:-30}
      NATS_REASSESSMENT_ACK_WAIT_SECONDS: ${NATS_REASSESSMENT_ACK_WAIT_SECONDS:-86400}
      NATS_THREAD_REASSESSMENT_MAX_AGE_DAYS: ${NATS_THREAD_REASSESSMENT_MAX_AGE_DAYS:-30}
      NATS_THREAD_REASSESSMENT_ACK_WAIT_SECONDS: ${NATS_THREAD_REASSESSMENT_ACK_WAIT_SECONDS:-86400}
      NATS_KB_REBUILD_MAX_AGE_DAYS: ${NATS_KB_REBUILD_MAX_AGE_DAYS:-30}
      NATS_KB_REBUILD_ACK_WAIT_SECONDS: ${NATS_KB_REBUILD_ACK_WAIT_SECONDS:-86400}
      NATS_MAX_DELIVERIES: ${NATS_MAX_DELIVERIES:-5}
    depends_on:
      nats: {condition: service_healthy}

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret}
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://wagi_app:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}?sslmode=disable
      NATS_URL: nats://nats:4222
      PORT: 8080
      MEDIA_DIR: /data/media
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-}
      MEDIA_CLEANUP_TOKEN: ${MEDIA_CLEANUP_TOKEN:?MEDIA_CLEANUP_TOKEN must be set}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret}
      MINIO_BUCKET: ${MINIO_BUCKET:-wa-media}
      MINIO_BUCKET_IMAGES: ${MINIO_BUCKET_IMAGES:-wa-media-images}
      MINIO_BUCKET_VIDEOS: ${MINIO_BUCKET_VIDEOS:-wa-media-videos}
      MINIO_BUCKET_AUDIO: ${MINIO_BUCKET_AUDIO:-wa-media-audio}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-wa-media-documents}
      MINIO_BUCKET_OTHER: ${MINIO_BUCKET_OTHER:-wa-media-other}
      MEDIA_BUCKET_MIGRATION_ENABLED: ${MEDIA_BUCKET_MIGRATION_ENABLED:-true}
      WAGI_CORS_ORIGIN: ${WAGI_CORS_ORIGIN:-}
      WAGI_COOKIE_SECURE: ${WAGI_COOKIE_SECURE:-false}
      WAGI_PUBLIC_URL: ${WAGI_PUBLIC_URL:-http://localhost:3000}
      WAGI_BOOTSTRAP_ADMIN_EMAIL: ${WAGI_BOOTSTRAP_ADMIN_EMAIL:-volker@kerkhoff.es}
      WAGI_BOOTSTRAP_ADMIN_NAME: ${WAGI_BOOTSTRAP_ADMIN_NAME:-Volker Kerkhoff}
      WAGI_BOOTSTRAP_ADMIN_PASSWORD: ${WAGI_BOOTSTRAP_ADMIN_PASSWORD:-Ctas2025!}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-WAGI}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      EMAIL_VERIFICATION_HOURS: ${EMAIL_VERIFICATION_HOURS:-48}
      PASSWORD_RESET_HOURS: ${PASSWORD_RESET_HOURS:-1}
      WA_CONNECTOR_POOL_SIZE: ${WA_CONNECTOR_POOL_SIZE:-5}
      TG_CONNECTOR_POOL_SIZE: ${TG_CONNECTOR_POOL_SIZE:-5}
      WA_ONBOARDING_SLOTS: ${WA_ONBOARDING_SLOTS:-1}
      TG_ONBOARDING_SLOTS: ${TG_ONBOARDING_SLOTS:-1}
    volumes:
      - media_data:/data/media:ro
    depends_on:
      db: {condition: service_healthy}
      nats: {condition: service_healthy}
      minio: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}

  tg-connector:
    build:
      context: ../..
      dockerfile: apps/tg-connector-go/Dockerfile
    environment:
      DATABASE_URL: postgres://wagi_app:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      NATS_URL: nats://nats:4222
      TG_PORT: 3002
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      TG_STATE_DIR: /data/tg-state
      TG_BACKFILL_DAYS: ${TG_BACKFILL_DAYS:-7}
      TG_BACKFILL_THROTTLE_MS: ${TG_BACKFILL_THROTTLE_MS:-500}
      TG_BACKFILL_GROUP_DELAY_MS: ${TG_BACKFILL_GROUP_DELAY_MS:-2000}
      GROUP_REFRESH_INTERVAL_MS: ${GROUP_REFRESH_INTERVAL_MS:-60000}
      MEDIA_DIR: /data/media
      MEDIA_CLEANUP_TOKEN: ${MEDIA_CLEANUP_TOKEN:?MEDIA_CLEANUP_TOKEN must be set}
      CONNECTOR_POOL_ENABLED: ${CONNECTOR_POOL_ENABLED:-true}
      CONNECTOR_ROLE: onboarding
      TG_CONNECTOR_POOL_SIZE: ${TG_CONNECTOR_POOL_SIZE:-5}
      TG_ONBOARDING_SLOTS: ${TG_ONBOARDING_SLOTS:-1}
      CONNECTOR_SYNC_INTERVAL_SECONDS: ${CONNECTOR_SYNC_INTERVAL_SECONDS:-300}
      CONNECTOR_WORKER_ID: ${CONNECTOR_WORKER_ID:-}
      CONNECTOR_ACCOUNT_ID: ${TG_CONNECTOR_ACCOUNT_ID:-}
      CONNECTOR_LEASE_SECONDS: ${CONNECTOR_LEASE_SECONDS:-90}
      CONNECTOR_ACCOUNT_SLOT_SECONDS: ${CONNECTOR_ACCOUNT_SLOT_SECONDS:-1800}
      WAGI_BOOTSTRAP_ADMIN_EMAIL: ${WAGI_BOOTSTRAP_ADMIN_EMAIL:-volker@kerkhoff.es}
    volumes:
      - tg_state:/data/tg-state
      - media_data:/data/media
    depends_on:
      db: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}

  # WhatsApp uses the PostgreSQL-backed whatsmeow connector for onboarding and
  # processing. The onboarding service exposes the internal QR/status endpoint;
  # the worker service consumes processing leases.
  wa-connector:
    build:
      context: ../..
      dockerfile: apps/wa-connector-go/Dockerfile
    environment:
      DATABASE_URL: postgres://wagi_app:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}?sslmode=${WA_DATABASE_SSLMODE:-disable}
      NATS_URL: nats://nats:4222
      WA_PORT: 3001
      WA_BACKFILL_DAYS: ${WA_BACKFILL_DAYS:-7}
      WA_BACKFILL_THROTTLE_MS: ${WA_BACKFILL_THROTTLE_MS:-250}
      WA_BACKFILL_GROUP_DELAY_MS: ${WA_BACKFILL_GROUP_DELAY_MS:-1500}
      WA_HISTORY_PAGE_SIZE: ${WA_HISTORY_PAGE_SIZE:-50}
      WA_HISTORY_REQUEST_DELAY_MS: ${WA_HISTORY_REQUEST_DELAY_MS:-500}
      WA_MEDIA_DOWNLOAD_ATTEMPTS: ${WA_MEDIA_DOWNLOAD_ATTEMPTS:-3}
      WA_MEDIA_RETRY_INTERVAL_MS: ${WA_MEDIA_RETRY_INTERVAL_MS:-60000}
      WA_SYNC_GRACE_SECONDS: ${WA_SYNC_GRACE_SECONDS:-60}
      WA_WHATSMEOW_SQL_SCHEMA: ${WA_WHATSMEOW_SQL_SCHEMA:-wa_whatsmeow}
      MEDIA_DIR: /data/media
      MEDIA_CLEANUP_TOKEN: ${MEDIA_CLEANUP_TOKEN:?MEDIA_CLEANUP_TOKEN must be set}
      CONNECTOR_POOL_ENABLED: ${CONNECTOR_POOL_ENABLED:-true}
      CONNECTOR_ROLE: onboarding
      WA_CONNECTOR_POOL_SIZE: ${WA_CONNECTOR_POOL_SIZE:-5}
      WA_ONBOARDING_SLOTS: ${WA_ONBOARDING_SLOTS:-1}
      CONNECTOR_SYNC_INTERVAL_SECONDS: ${CONNECTOR_SYNC_INTERVAL_SECONDS:-300}
      CONNECTOR_WORKER_ID: ${CONNECTOR_WORKER_ID:-}
      CONNECTOR_ACCOUNT_ID: ${WA_CONNECTOR_ACCOUNT_ID:-}
      CONNECTOR_LEASE_SECONDS: ${CONNECTOR_LEASE_SECONDS:-90}
      CONNECTOR_ACCOUNT_SLOT_SECONDS: ${CONNECTOR_ACCOUNT_SLOT_SECONDS:-1800}
    volumes:
      - media_data:/data/media
    depends_on:
      db: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}

  wa-connector-worker:
    build:
      context: ../..
      dockerfile: apps/wa-connector-go/Dockerfile
    environment:
      DATABASE_URL: postgres://wagi_app:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}?sslmode=${WA_DATABASE_SSLMODE:-disable}
      NATS_URL: nats://nats:4222
      WA_PORT: 3001
      WA_BACKFILL_DAYS: ${WA_BACKFILL_DAYS:-7}
      WA_BACKFILL_THROTTLE_MS: ${WA_BACKFILL_THROTTLE_MS:-250}
      WA_BACKFILL_GROUP_DELAY_MS: ${WA_BACKFILL_GROUP_DELAY_MS:-1500}
      WA_HISTORY_PAGE_SIZE: ${WA_HISTORY_PAGE_SIZE:-50}
      WA_HISTORY_REQUEST_DELAY_MS: ${WA_HISTORY_REQUEST_DELAY_MS:-500}
      WA_MEDIA_DOWNLOAD_ATTEMPTS: ${WA_MEDIA_DOWNLOAD_ATTEMPTS:-3}
      WA_MEDIA_RETRY_INTERVAL_MS: ${WA_MEDIA_RETRY_INTERVAL_MS:-60000}
      WA_SYNC_GRACE_SECONDS: ${WA_SYNC_GRACE_SECONDS:-60}
      WA_WHATSMEOW_SQL_SCHEMA: ${WA_WHATSMEOW_SQL_SCHEMA:-wa_whatsmeow}
      MEDIA_DIR: /data/media
      MEDIA_CLEANUP_TOKEN: ${MEDIA_CLEANUP_TOKEN:?MEDIA_CLEANUP_TOKEN must be set}
      CONNECTOR_POOL_ENABLED: ${CONNECTOR_POOL_ENABLED:-true}
      CONNECTOR_ROLE: processing
      WA_CONNECTOR_POOL_SIZE: ${WA_CONNECTOR_POOL_SIZE:-5}
      WA_ONBOARDING_SLOTS: ${WA_ONBOARDING_SLOTS:-1}
      CONNECTOR_SYNC_INTERVAL_SECONDS: ${CONNECTOR_SYNC_INTERVAL_SECONDS:-300}
      CONNECTOR_WORKER_ID: ${CONNECTOR_WORKER_ID:-}
      CONNECTOR_ACCOUNT_ID: ${WA_CONNECTOR_ACCOUNT_ID:-}
      CONNECTOR_LEASE_SECONDS: ${CONNECTOR_LEASE_SECONDS:-90}
      CONNECTOR_ACCOUNT_SLOT_SECONDS: ${CONNECTOR_ACCOUNT_SLOT_SECONDS:-1800}
      CONNECTOR_START_DELAY_MS: ${CONNECTOR_START_DELAY_MS:-5000}
      CONNECTOR_POOL_RETRY_DELAY_MS: ${CONNECTOR_POOL_RETRY_DELAY_MS:-20000}
    volumes:
      - media_data:/data/media
    depends_on:
      db: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}

  tg-connector-worker:
    # See wa-connector-worker above: this service intentionally has no host
    # port because only the primary connector exposes the control endpoint.
    build:
      context: ../..
      dockerfile: apps/tg-connector-go/Dockerfile
    environment:
      DATABASE_URL: postgres://wagi_app:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      NATS_URL: nats://nats:4222
      TG_PORT: 3002
      TG_STATE_DIR: /data/tg-state
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      TG_BACKFILL_DAYS: ${TG_BACKFILL_DAYS:-7}
      TG_BACKFILL_THROTTLE_MS: ${TG_BACKFILL_THROTTLE_MS:-500}
      TG_BACKFILL_GROUP_DELAY_MS: ${TG_BACKFILL_GROUP_DELAY_MS:-2000}
      GROUP_REFRESH_INTERVAL_MS: ${GROUP_REFRESH_INTERVAL_MS:-60000}
      MEDIA_DIR: /data/media
      MEDIA_CLEANUP_TOKEN: ${MEDIA_CLEANUP_TOKEN:?MEDIA_CLEANUP_TOKEN must be set}
      CONNECTOR_POOL_ENABLED: ${CONNECTOR_POOL_ENABLED:-true}
      CONNECTOR_ROLE: processing
      TG_CONNECTOR_POOL_SIZE: ${TG_CONNECTOR_POOL_SIZE:-5}
      TG_ONBOARDING_SLOTS: ${TG_ONBOARDING_SLOTS:-1}
      CONNECTOR_SYNC_INTERVAL_SECONDS: ${CONNECTOR_SYNC_INTERVAL_SECONDS:-300}
      CONNECTOR_WORKER_ID: ${CONNECTOR_WORKER_ID:-}
      CONNECTOR_ACCOUNT_ID: ${TG_CONNECTOR_ACCOUNT_ID:-}
      CONNECTOR_LEASE_SECONDS: ${CONNECTOR_LEASE_SECONDS:-90}
      CONNECTOR_ACCOUNT_SLOT_SECONDS: ${CONNECTOR_ACCOUNT_SLOT_SECONDS:-1800}
      CONNECTOR_START_DELAY_MS: ${CONNECTOR_START_DELAY_MS:-5000}
      CONNECTOR_POOL_RETRY_DELAY_MS: ${CONNECTOR_POOL_RETRY_DELAY_MS:-20000}
      WAGI_BOOTSTRAP_ADMIN_EMAIL: ${WAGI_BOOTSTRAP_ADMIN_EMAIL:-volker@kerkhoff.es}
    volumes:
      - tg_state:/data/tg-state
      - media_data:/data/media
    depends_on:
      db: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}

  ai-worker:
    build:
      context: ../..
      dockerfile: apps/ai-worker/Dockerfile
    environment:
      DATABASE_URL: postgres://wagi_app:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      NATS_URL: nats://nats:4222
      NATS_MAX_DELIVERIES: ${NATS_MAX_DELIVERIES:-5}
      NATS_RETRY_BASE_SECONDS: ${NATS_RETRY_BASE_SECONDS:-5}
      NATS_RETRY_MAX_SECONDS: ${NATS_RETRY_MAX_SECONDS:-300}
      AI_MODEL: ${AI_MODEL:-heuristic-mvp}
      AI_PROVIDER: ${AI_PROVIDER:-hybrid}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-cascade-v5-places}
      AI_KNOWLEDGE_VERSION: ${AI_KNOWLEDGE_VERSION:-cascade-v5-places}
      AI_CONTEXT_MAX_MESSAGES: ${AI_CONTEXT_MAX_MESSAGES:-80}
      AI_EVENT_WINDOW_HOURS: ${AI_EVENT_WINDOW_HOURS:-36}
      AI_THREAD_WINDOW_HOURS: ${AI_THREAD_WINDOW_HOURS:-18}
      AI_THREAD_MAX_CANDIDATES: ${AI_THREAD_MAX_CANDIDATES:-6}
      AI_THREAD_AUTO_LINK_THRESHOLD: ${AI_THREAD_AUTO_LINK_THRESHOLD:-0.50}
      AI_THREAD_CONTEXT_THRESHOLD: ${AI_THREAD_CONTEXT_THRESHOLD:-0.42}
      AI_EVENT_MIN_CONFIDENCE: ${AI_EVENT_MIN_CONFIDENCE:-0.70}
      AI_EMBEDDINGS_ENABLED: ${AI_EMBEDDINGS_ENABLED:-true}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      AI_EMBEDDING_CACHE_DIR: ${AI_EMBEDDING_CACHE_DIR:-/root/.cache/fastembed}
      AI_HF_MODEL_LOAD_INTERVAL_SECONDS: ${AI_HF_MODEL_LOAD_INTERVAL_SECONDS:-86400}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
      HF_HUB_ETAG_TIMEOUT: ${HF_HUB_ETAG_TIMEOUT:-10}
      AI_SEMANTIC_DISCOVERY_THRESHOLD: ${AI_SEMANTIC_DISCOVERY_THRESHOLD:-0.84}
      AI_SEMANTIC_MERGE_THRESHOLD: ${AI_SEMANTIC_MERGE_THRESHOLD:-0.18}
      AI_PLACE_NER_ENABLED: ${AI_PLACE_NER_ENABLED:-true}
      AI_PLACE_NER_MODEL: ${AI_PLACE_NER_MODEL:-}
      AI_PLACE_MIN_CONFIDENCE: ${AI_PLACE_MIN_CONFIDENCE:-0.70}
      AI_PLACE_HERMES_ENABLED: ${AI_PLACE_HERMES_ENABLED:-true}
      AI_PLACE_HERMES_MIN_CONFIDENCE: ${AI_PLACE_HERMES_MIN_CONFIDENCE:-0.78}
      AI_PLACE_LEARNING_MIN_CONFIDENCE: ${AI_PLACE_LEARNING_MIN_CONFIDENCE:-0.82}
      AI_PLACE_GEOCODER_ENABLED: ${AI_PLACE_GEOCODER_ENABLED:-false}
      AI_PLACE_GEOCODER_URL: ${AI_PLACE_GEOCODER_URL:-https://nominatim.openstreetmap.org/search}
      AI_PLACE_GEOCODER_USER_AGENT: ${AI_PLACE_GEOCODER_USER_AGENT:-wagi-place-resolver/1.0}
      AI_PLACE_GEOCODER_TIMEOUT_MS: ${AI_PLACE_GEOCODER_TIMEOUT_MS:-5000}
      AI_PLACE_GEOCODER_THROTTLE_MS: ${AI_PLACE_GEOCODER_THROTTLE_MS:-1100}
      AI_PLACE_REQUIRE_GEOCODER: ${AI_PLACE_REQUIRE_GEOCODER:-false}
      AI_HERMES_ENABLED: ${AI_HERMES_ENABLED:-false}
      AI_HERMES_URL: ${AI_HERMES_URL:-}
      AI_HERMES_API_KEY: ${AI_HERMES_API_KEY:-}
      AI_HERMES_MODEL: ${AI_HERMES_MODEL:-hermes-agent}
      AI_HERMES_TIMEOUT_MS: ${AI_HERMES_TIMEOUT_MS:-60000}
      AI_HERMES_CONNECT_TIMEOUT_MS: ${AI_HERMES_CONNECT_TIMEOUT_MS:-10000}
      AI_HERMES_RETRY_ATTEMPTS: ${AI_HERMES_RETRY_ATTEMPTS:-3}
      AI_HERMES_RETRY_BASE_MS: ${AI_HERMES_RETRY_BASE_MS:-1500}
      AI_HERMES_RETRY_MAX_MS: ${AI_HERMES_RETRY_MAX_MS:-10000}
      AI_HERMES_FAILURE_COOLDOWN_SECONDS: ${AI_HERMES_FAILURE_COOLDOWN_SECONDS:-60}
      AI_HERMES_REVIEW_ALL: ${AI_HERMES_REVIEW_ALL:-false}
      AI_HERMES_MIN_CONFIDENCE: ${AI_HERMES_MIN_CONFIDENCE:-0.78}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-5}
      AI_STALE_PROCESSING_SECONDS: ${AI_STALE_PROCESSING_SECONDS:-900}
      AI_REASSESSMENT_DELAY_MS: ${AI_REASSESSMENT_DELAY_MS:-100}
      AI_DOCUMENT_ANALYSIS_MAX_CHARS: ${AI_DOCUMENT_ANALYSIS_MAX_CHARS:-12000}
      AI_NATS_PAYLOAD_LIMIT_BYTES: ${AI_NATS_PAYLOAD_LIMIT_BYTES:-900000}
      AI_LEARNING_INFERENCE_BASE_DELTA: ${AI_LEARNING_INFERENCE_BASE_DELTA:-0.003}
      AI_LEARNING_CONTEXT_BONUS: ${AI_LEARNING_CONTEXT_BONUS:-0.009}
      AI_LEARNING_MAX_DELTA: ${AI_LEARNING_MAX_DELTA:-0.015}
      AI_LEARNING_MAX_TERMS_PER_SIGNAL: ${AI_LEARNING_MAX_TERMS_PER_SIGNAL:-8}
    volumes:
      - ai_models:/root/.cache/fastembed
    depends_on:
      db: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}

  media-worker:
    build:
      context: ../..
      dockerfile: apps/media-worker/Dockerfile
    environment:
      DATABASE_URL: postgres://wagi_app:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      NATS_URL: nats://nats:4222
      NATS_MAX_DELIVERIES: ${NATS_MAX_DELIVERIES:-5}
      NATS_RETRY_BASE_SECONDS: ${NATS_RETRY_BASE_SECONDS:-5}
      NATS_RETRY_MAX_SECONDS: ${NATS_RETRY_MAX_SECONDS:-300}
      MEDIA_ANALYSIS_EVENT_MAX_CHARS: ${MEDIA_ANALYSIS_EVENT_MAX_CHARS:-12000}
      WHISPER_ENABLED: ${WHISPER_ENABLED:-true}
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_CPP_BIN: /usr/local/bin/whisper-cli
      WHISPER_MODEL_PATH: /models/ggml-medium.bin
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-auto}
      WHISPER_LANGUAGES: ${WHISPER_LANGUAGES:-es,ca,de,en,fr}
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
      MEDIA_MAX_RETRIES: ${MEDIA_MAX_RETRIES:-3}
      MEDIA_STALE_PROCESSING_SECONDS: ${MEDIA_STALE_PROCESSING_SECONDS:-900}
      MEDIA_DIR: /data/media
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret}
      MINIO_BUCKET: ${MINIO_BUCKET:-wa-media}
      MINIO_BUCKET_IMAGES: ${MINIO_BUCKET_IMAGES:-wa-media-images}
      MINIO_BUCKET_VIDEOS: ${MINIO_BUCKET_VIDEOS:-wa-media-videos}
      MINIO_BUCKET_AUDIO: ${MINIO_BUCKET_AUDIO:-wa-media-audio}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-wa-media-documents}
      MINIO_BUCKET_OTHER: ${MINIO_BUCKET_OTHER:-wa-media-other}
      MEDIA_CLEANUP_TOKEN: ${MEDIA_CLEANUP_TOKEN:?MEDIA_CLEANUP_TOKEN must be set}
    volumes:
      - whisper_models:/models
      - media_data:/data/media
    depends_on:
      db: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      HOSTNAME: 0.0.0.0
    depends_on: [api]

  nginx:
    image: nginx:1.27-alpine
    ports: ["${WAGI_PUBLIC_PORT:-3000}:80"]
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_started}
      web: {condition: service_started}

volumes:
  postgres_data:
  nats_data:
  minio_data:
  tg_state:
  whisper_models:
  media_data:
  ai_models:
