services:
  db:
    image: supabase/postgres:15.8.1.060
    environment:
      # Supabase's bootstrap scripts require the standard postgres role.
      # Application services connect through the least-privileged app role created by the migration.
      POSTGRES_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supabase_admin} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: postgres:15-alpine
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - ../migrations:/migrations:ro
      - ../migration-runner:/runner:ro
    command: ["/bin/sh", "/runner/run.sh"]
    depends_on:
      db: {condition: service_healthy}

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    volumes:
      - nats_data:/data/jetstream
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats-provisioner:
    build:
      context: ../nats-provisioner
      dockerfile: Dockerfile
    env_file:
      - ./env/nats-provisioner.env
    depends_on:
      nats: {condition: service_healthy}

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    env_file:
      - ./env/minio.env
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./env/api.env
    volumes:
      - media_data:/data/media:ro
    depends_on:
      db: {condition: service_healthy}
      nats: {condition: service_healthy}
      minio: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}

  tg-connector:
    build:
      context: ../..
      dockerfile: apps/tg-connector-go/Dockerfile
    env_file:
      - ./env/tg-connector.env
    volumes:
      - tg_state:/data/tg-state
      - media_data:/data/media
    depends_on:
      db: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}

  # WhatsApp uses the PostgreSQL-backed whatsmeow connector for onboarding and
  # processing. The onboarding service exposes the internal QR/status endpoint;
  # the worker service consumes processing leases.
  wa-connector:
    build:
      context: ../..
      dockerfile: apps/wa-connector-go/Dockerfile
    env_file:
      - ./env/wa-connector.env
    volumes:
      - media_data:/data/media
    depends_on:
      db: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}

  wa-connector-worker:
    build:
      context: ../..
      dockerfile: apps/wa-connector-go/Dockerfile
    env_file:
      - ./env/wa-connector-worker.env
    volumes:
      - media_data:/data/media
    depends_on:
      db: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}

  tg-connector-worker:
    # See wa-connector-worker above: this service intentionally has no host
    # port because only the primary connector exposes the control endpoint.
    build:
      context: ../..
      dockerfile: apps/tg-connector-go/Dockerfile
    env_file:
      - ./env/tg-connector-worker.env
    volumes:
      - tg_state:/data/tg-state
      - media_data:/data/media
    depends_on:
      db: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}

  ai-worker:
    build:
      context: ../..
      dockerfile: apps/ai-worker/Dockerfile
    env_file:
      - ./env/ai-worker.env
    volumes:
      - ai_models:/root/.cache/fastembed
    depends_on:
      db: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}

  media-worker:
    build:
      context: ../..
      dockerfile: apps/media-worker/Dockerfile
    env_file:
      - ./env/media-worker.env
    volumes:
      - whisper_models:/models
      - media_data:/data/media
    depends_on:
      db: {condition: service_healthy}
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      nats-provisioner: {condition: service_completed_successfully}

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    env_file:
      - ./env/web.env
    depends_on: [api]

  nginx:
    image: nginx:1.27-alpine
    ports: ["${WAGI_PUBLIC_PORT:-3000}:80"]
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_started}
      web: {condition: service_started}

volumes:
  postgres_data:
  nats_data:
  minio_data:
  tg_state:
  whisper_models:
  media_data:
  ai_models:
